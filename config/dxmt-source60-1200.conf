# Requires the private translator and matching v1 native window driver.
[Overwatch.exe]
d3d11.releaseShaderIR = True
# Legacy profile filename; user requested uncapped presentation on 2026-09-12.
d3d11.preferredMaxFrameRate = 0
# Eight normal-priority workers: the 2026-09-12 match saturated four (queue waits up to 223 ms).
d3d11.shaderCompilerThreads = 8
d3d11.shaderCompilerNormalPriority = True
dxgi.fullscreenCanvasWidth = 1920
dxgi.fullscreenCanvasHeight = 1200
dxgi.nativeFullscreen = True
dxgi.maxFrameLatency = 1
dxgi.sharpPresentation = True
# v1.0, the owner's play-tests of candidates 5-7: after the frame-latency wait the
# game thread sleeps the 10th percentile of recent frames' slack minus 1 ms, so its
# next frame samples input later at the same GPU load (frame latency -16%).
dxgi.presentPacing = True
dxgi.presentPacingMode = 3
dxgi.presentPacingTargetUs = 1000
